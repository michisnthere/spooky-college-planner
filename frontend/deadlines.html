<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadline Tracker | Spooky College Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Spooky College Planner</h1>
    <p class="site-tagline">Bury your college worries and track every deadline.</p>
    <a class="back-link" href="index.html">Back to graveyard</a>

  <main class="main-content">

      <div class="deadline-track" id="deadline-track" aria-label="Application deadline timeline">

    </section>
  </main>

  <script src="js/app.js"></script>
