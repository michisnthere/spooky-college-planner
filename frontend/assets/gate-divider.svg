<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" fill="#2E323E" stroke="#2E323E">
  <!-- One repeating unit of a Victorian cemetery gate: two rails, thin vertical bars with
       spearhead tips, and a scrollwork medallion in the middle. Bars sit 24 units apart,
       including across the tile edge, so repeating the unit sideways looks continuous. -->
  <g stroke="none">
    <rect x="0" y="16" width="160" height="2"/>
    <rect x="0" y="38" width="160" height="2"/>
    <!-- Bars with spearhead tips and small side barbs -->
    <g id="bar">
      <rect x="11.2" y="10" width="1.6" height="38"/>
      <path d="M12,0 L16,10 L12,8 L8,10 Z"/>
      <path d="M9,12 L12,9 L15,12 L12,11 Z"/>
    </g>
    <use href="#bar" x="24"/>
    <use href="#bar" x="48"/>
    <use href="#bar" x="88"/>
    <use href="#bar" x="112"/>
    <use href="#bar" x="136"/>
    <!-- Centre post, taller, with a finial -->
    <rect x="79.2" y="6" width="1.6" height="42"/>
    <path d="M80,0 L83,6 L80,5 L77,6 Z"/>
    <circle cx="80" cy="3" r="1.4"/>
  </g>
  <!-- Scrollwork between the bars and the centre post -->
  <g fill="none" stroke-width="1.4" stroke-linecap="round">
    <path d="M73,28 C73,22 66,21 66,26 C66,30 70,30 70,27"/>
    <path d="M87,28 C87,22 94,21 94,26 C94,30 90,30 90,27"/>
    <path d="M73,28 C76,32 78,28 80,28"/>
    <path d="M87,28 C84,32 82,28 80,28"/>
    <circle cx="80" cy="28" r="4.5"/>
  </g>
  <path d="M80,24.5 L83.5,28 L80,31.5 L76.5,28 Z" stroke="none"/>
</svg>
